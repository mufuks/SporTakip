<div id="v0-modal-finish-workout" class="modal-backdrop">
      <div class="v0-finish-modal-box">
        <div style="text-align:center; margin-bottom:14px;">
          <span style="font-size:36px; display:inline-block; margin-bottom:6px;">🏆</span>
          <h3 style="font-size:17px; font-weight:800; color:var(--text-primary); margin:0;">Tebrikler, İdmanı Bitirdin!</h3>
          <span class="v0-finish-duration-pill" id="v0-finish-modal-duration">⏱ Toplam Süre: -- dk</span>
        </div>

        <div style="margin-bottom:14px; text-align:center; background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); border-radius:14px; padding:12px 10px;">
          <label style="display:block; font-size:11.5px; font-weight:700; color:var(--text-secondary); margin-bottom:6px;">Antrenman Değerlendirmen</label>
          <div style="display:flex; justify-content:center; gap:8px; font-size:24px;" id="v0-star-rating">
            <span class="v0-star" data-rating="1" onclick="setWorkoutRating(1)" style="cursor:pointer;">⭐</span>
            <span class="v0-star" data-rating="2" onclick="setWorkoutRating(2)" style="cursor:pointer;">⭐</span>
            <span class="v0-star" data-rating="3" onclick="setWorkoutRating(3)" style="cursor:pointer;">⭐</span>
            <span class="v0-star" data-rating="4" onclick="setWorkoutRating(4)" style="cursor:pointer;">⭐</span>
            <span class="v0-star" data-rating="5" onclick="setWorkoutRating(5)" style="cursor:pointer;">⭐</span>
          </div>
        </div>

        <div style="margin-bottom:18px;">
          <label style="display:block; font-size:11.5px; font-weight:700; color:var(--text-secondary); margin-bottom:6px;">Antrenman Notu (İsteğe Bağlı)</label>
          <input type="text" id="v0-finish-notes" class="v0-phone-input" placeholder="Örn: Squat formum çok akıcıydı 💪" style="width:100%; box-sizing:border-box; font-size:12.5px; padding:10px 12px; border-radius:10px; background:var(--bg-surface-elevated); color:var(--text-primary); border:1px solid var(--border-subtle);">
        </div>

        <div style="display:flex; gap:10px;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('v0-modal-finish-workout')" style="flex:1; padding:10px; font-size:12.5px; font-weight:700; border-radius:9999px;">Vazgeç</button>
          <button type="button" class="v0-btn-submit" onclick="submitFinishWorkout()" style="flex:1.8; margin:0; padding:10px; font-size:12.5px; font-weight:800;">Tamamla & Kaydet</button>
        </div>
      </div>
    </div>

    <!-- Modal: Egzersiz Tanımla / Düzenle (Hoca, Admin, SuperAdmin) -->
    <div class="modal-backdrop" id="modal-exercise">
      <div class="modal-content" style="max-width:520px;">
        <div class="modal-header">
          <div>
            <h3 id="modal-exercise-title" style="margin:0; font-size:17px; font-weight:800;">➕ Yeni Egzersiz Tanımla</h3>
            <span class="text-volt" style="font-weight:700; font-size:12px;" id="modal-exercise-subtitle">Katalog ve Kas Grubu Ayarları</span>
          </div>
          <button class="modal-close" onclick="closeModal('modal-exercise')">✕</button>
        </div>
        <form id="exercise-form" onsubmit="handleSaveExercise(event)">
          <input type="hidden" id="ex-id">
          <div class="form-group" style="margin-bottom:12px;">
            <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Egzersiz Adı (İngilizce / Global) *</label>
            <input type="text" id="ex-name" class="form-control" placeholder="Örn: Incline Dumbbell Press" required>
          </div>
          <div class="form-group" style="margin-bottom:12px;">
            <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Türkçe Adı / Açıklayıcı İsim</label>
            <input type="text" id="ex-name-tr" class="form-control" placeholder="Örn: Eğimli Sehpa Dambıl Göğüs İtiş">
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
            <div class="form-group" style="margin-bottom:0;">
              <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Hedef Kas Grubu *</label>
              <select id="ex-muscle-group" class="form-control" required>
                <option value="Chest">Göğüs (Chest)</option>
                <option value="Back">Sırt (Back)</option>
                <option value="Legs">Bacak (Legs)</option>
                <option value="Shoulders">Omuz (Shoulders)</option>
                <option value="Arms">Kol (Arms)</option>
                <option value="Core">Karın / Core</option>
                <option value="Cardio">Kardiyo</option>
                <option value="FullBody">Tüm Vücut (Full Body)</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Ekipman Türü</label>
              <select id="ex-equipment" class="form-control">
                <option value="Barbell">Barbell (Halter)</option>
                <option value="Dumbbell">Dumbbell (Dambıl)</option>
                <option value="Kettlebell">Kettlebell</option>
                <option value="Cable">Kablo / Makara</option>
                <option value="Machine">Makine</option>
                <option value="Bodyweight">Vücut Ağırlığı</option>
                <option value="Band">Direnç Bandı</option>
                <option value="Serbest Ağırlık">Serbest Ağırlık</option>
                <option value="Diğer">Diğer</option>
              </select>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:12px;">
            <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Açıklama / Form İpuçları (İsteğe Bağlı)</label>
            <textarea id="ex-instructions" class="form-control" rows="3" placeholder="Örn: 30 derece açıyla ayarlanmış sehpada dirsekleri kırmadan kontrollü indirin..."></textarea>
          </div>
          <div class="form-group" style="margin-bottom:12px;">
            <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Görsel URL (İsteğe Bağlı)</label>
            <input type="url" id="ex-image-url" class="form-control" placeholder="https://...">
          </div>
          <div class="form-group" style="margin-bottom:16px;">
            <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Video / Rehber URL (İsteğe Bağlı)</label>
            <input type="url" id="ex-video-url" class="form-control" placeholder="https://...">
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button type="button" class="btn btn-secondary" onclick="closeModal('modal-exercise')">İptal</button>
            <button type="submit" class="btn btn-primary" id="btn-save-exercise">Kaydet</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: Program / Şablon Oluşturucu (Genel veya Kişiye Özel) -->
    <div class="modal-backdrop" id="modal-template-builder">
      <div class="modal-content" style="max-width:620px;">
        <div class="modal-header">
          <div>
            <h3 id="tb-modal-title" style="margin:0; font-size:17px; font-weight:800;">🏋️ Yeni Antrenman Programı Oluştur</h3>
            <span class="text-volt" style="font-weight:700; font-size:12px;" id="tb-modal-subtitle">Genel Şablon veya Kişiye Özel Program</span>
          </div>
          <button class="modal-close" onclick="closeModal('modal-template-builder')">✕</button>
        </div>
        <form id="template-builder-form" onsubmit="handleSaveWorkoutTemplate(event)">
          <div class="form-group" style="margin-bottom:12px;">
            <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Program Adı *</label>
            <input type="text" id="tb-name" class="form-control" placeholder="Örn: 4 Günlük Hipertrofi Split veya Ahmet - Bacak Güç" required>
          </div>
          <div style="display:grid; grid-template-columns:1.5fr 1fr; gap:12px; margin-bottom:12px;">
            <div class="form-group" style="margin-bottom:0;">
              <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Hedef Kitle / Atanacak Sporcu</label>
              <select id="tb-assigned-member" class="form-control">
                <option value="">🌐 Genel Şablon (Tüm Sporculara Açık)</option>
                <!-- Dinamik olarak doldurulur -->
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Kategori</label>
              <select id="tb-category" class="form-control">
                <option value="Strength">Güç (Strength)</option>
                <option value="Hypertrophy">Hipertrofi / Hacim</option>
                <option value="HIIT">HIIT / Kondisyon</option>
                <option value="Mobility">Mobilite / Esneklik</option>
                <option value="Cardio">Kardiyo</option>
                <option value="Mixed">Karma</option>
              </select>
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
            <div class="form-group" style="margin-bottom:0;">
              <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Tahmini Süre (Dakika)</label>
              <input type="number" id="tb-duration" class="form-control" value="60" min="15" max="180">
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Açıklama / Notlar</label>
              <input type="text" id="tb-description" class="form-control" placeholder="Örn: Isınma setlerinden sonra 2 RIR hedefleyin.">
            </div>
          </div>

          <!-- Egzersiz Ekleme Paneli -->
          <div style="background:var(--bg-surface-elevated); border:1px solid var(--border-subtle); border-radius:12px; padding:12px; margin-bottom:12px;">
            <span style="display:block; font-size:12px; font-weight:800; color:var(--text-primary); margin-bottom:8px;">➕ Programa Hareket Ekle</span>
            <div style="display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:8px; margin-bottom:8px;">
              <div>
                <select id="tb-add-exercise-select" class="form-control" style="font-size:12px;">
                  <option value="">Egzersiz seçiniz...</option>
                </select>
              </div>
              <div>
                <input type="number" id="tb-add-sets" class="form-control" placeholder="Set" value="3" min="1" max="10" style="font-size:12px;">
              </div>
              <div>
                <input type="text" id="tb-add-reps" class="form-control" placeholder="Tekrar" value="8-12" style="font-size:12px;">
              </div>
              <div>
                <input type="number" id="tb-add-rest" class="form-control" placeholder="Dinlenme (sn)" value="90" min="15" max="300" style="font-size:12px;">
              </div>
            </div>
            <button type="button" class="btn btn-secondary" onclick="addExerciseToBuilder()" style="width:100%; font-size:12px; padding:6px; font-weight:700;">
              + Hareketi Listeye Ekle
            </button>
          </div>

          <!-- Eklenen Egzersizler Listesi -->
          <div style="margin-bottom:14px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <span style="font-size:12px; font-weight:800; color:var(--text-secondary);">PROGRAMDAKİ HAREKETLER (<span id="tb-exercise-count">0</span>)</span>
            </div>
            <div id="tb-selected-exercises-list" style="max-height:160px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;">
              <div style="text-align:center; padding:16px; color:var(--text-muted); font-size:12px; border:1px dashed var(--border-subtle); border-radius:8px;">
                Henüz hareket eklenmedi. Yukarıdan seçip ekleyin.
              </div>
            </div>
          </div>

          <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button type="button" class="btn btn-secondary" onclick="closeModal('modal-template-builder')">İptal</button>
            <button type="submit" class="btn btn-primary" id="btn-save-template">Kaydet & Yayınla</button>
          </div>
        </form>
      </div>
    </div>
