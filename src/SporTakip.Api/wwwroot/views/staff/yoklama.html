<section id="view-yoklama" class="v0-section animate-fade-in" style="display:none;">
  <!-- Day Scope Segmented Controller: [ ◀ Dün ] | [ ● Bugün (Canlı) ] -->
  <div class="day-scope-selector" style="display:flex; gap:8px; margin-top:2px; margin-bottom:14px;">
    <button type="button" id="btn-scope-yesterday" class="day-scope-btn" onclick="switchAttendanceDayScope('yesterday')">
      <span>◀</span> Dün <span id="label-scope-yesterday" style="opacity:0.8; font-weight:600; font-size:11px; margin-left:3px;"></span>
    </button>
    <button type="button" id="btn-scope-today" class="day-scope-btn active" onclick="switchAttendanceDayScope('today')">
      <span class="live-dot" style="width:7px; height:7px; border-radius:50%; background:var(--volt-lime); box-shadow:0 0 8px var(--volt-lime); display:inline-block;"></span>
      Bugün <span id="label-scope-today" style="opacity:0.8; font-weight:600; font-size:11px; margin-left:3px;">(Canlı)</span>
    </button>
  </div>

  <!-- Dynamic Live Sessions Feed Container -->
  <div id="attendance-sessions-feed" class="sessions-feed-container">
    <div style="color:var(--text-muted); padding:30px; text-align:center;">Seanslar yükleniyor...</div>
  </div>

  <!-- Hidden backward-compatibility elements to avoid breaking any legacy references -->
  <div id="attendance-list" style="display:none;"></div>
  <div id="capacity-slots-list" style="display:none;"></div>
  <div id="slot-details-box" style="display:none;"></div>
  <div id="capacity-week-strip" style="display:none;"></div>
</section>
