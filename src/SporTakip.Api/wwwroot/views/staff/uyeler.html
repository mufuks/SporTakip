<section id="view-uyeler" class="v0-section animate-fade-in" style="display:none;">
      <div class="page-header">
        <div>
          <h2 class="page-title">SPORCULAR & <span class="text-volt">PAKETLER</span></h2>
          <p class="page-subtitle">Kayıtlı tüm üyeler, geçmiş paketler ve yeni satış işlemleri.</p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="İsim veya telefon ara..." oninput="handleMemberSearch(this.value)">
          </div>
          <button class="btn-primary" onclick="openNewMemberModal()">+ Yeni Üye</button>
        </div>
      </div>

      <div class="glass-card table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>Ad Soyad</th>
              <th>Telefon</th>
              <th>Aktif Paket Durumu</th>
              <th>Toplam Dönem</th>
              <th>İşlemler</th>
            </tr>
          </thead>
          <tbody id="members-table-body">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </section>
