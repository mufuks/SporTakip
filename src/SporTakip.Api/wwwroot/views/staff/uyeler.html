<section id="view-uyeler" class="v0-section animate-fade-in" style="display:none;">
  <div class="page-header" style="margin-bottom:14px;">
    <div>
      <h2 class="page-title">ÖĞRENCİLERİM & <span class="text-volt">GELİŞİM</span></h2>
      <p class="page-subtitle">Kayıtlı sporcular, paket hakları, vücut ölçümleri ve gelişim takibi.</p>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="İsim veya telefon ara..." oninput="handleMemberSearch(this.value)">
      </div>
      <button class="btn-primary" onclick="openNewMemberModal()" style="height:36px; padding:0 14px; font-size:12.5px; border-radius:10px;">+ Yeni Sporcu</button>
    </div>
  </div>

  <!-- Quick Filter Chips -->
  <div class="filter-chips" style="margin-bottom:16px;">
    <button class="filter-chip active" data-student-filter="all" onclick="filterStudentsList('all')">Tüm Sporcular</button>
    <button class="filter-chip" data-student-filter="active" onclick="filterStudentsList('active')">⚡ Aktif Paketi Olanlar</button>
    <button class="filter-chip" data-student-filter="expiring" onclick="filterStudentsList('expiring')">⚠️ Son 1-2 Ders</button>
    <button class="filter-chip" data-student-filter="medical" onclick="filterStudentsList('medical')">🩺 Sakatlık / Kısıt</button>
  </div>

  <!-- Mobile-First Student Cards Feed (Reels-inspired) -->
  <div class="student-cards-grid" id="student-cards-grid">
    <div style="color:var(--text-muted); padding:32px; text-align:center;">Öğrenci listesi yükleniyor...</div>
  </div>

  <!-- Desktop Traditional Table View (Visible only on desktop screens) -->
  <div class="glass-card table-responsive desktop-only-table" style="margin-top:20px;">
    <table class="custom-table">
      <thead>
        <tr>
          <th>Ad Soyad & Sakatlık</th>
          <th>Telefon</th>
          <th>Aktif Paket Durumu</th>
          <th>Dönem</th>
          <th>İşlemler</th>
        </tr>
      </thead>
      <tbody id="members-table-body">
        <!-- Dynamically populated -->
      </tbody>
    </table>
  </div>
</section>
