<section id="view-uyeler" class="v0-section animate-fade-in" style="display:none;">
  <!-- Streamlined Members Search & Action Toolbar -->
  <div class="members-toolbar" style="display:flex; align-items:center; gap:8px; margin-top:2px; margin-bottom:12px; width:100%;">
    <div class="search-wrapper" style="flex:1; max-width:none; position:relative; min-width:0;">
      <span class="search-icon" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:13px; pointer-events:none;">🔍</span>
      <input type="text" class="search-input" placeholder="İsim veya telefon ara..." oninput="handleMemberSearch(this.value)" style="height:38px; padding:0 12px 0 32px; font-size:13px; border-radius:10px; width:100%; box-sizing:border-box;">
    </div>
    <button type="button" class="btn-primary" onclick="openNewMemberModal()" style="height:38px; padding:0 12px; font-size:12px; font-weight:700; border-radius:10px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; box-shadow:0 2px 8px rgba(204,255,0,0.25); flex-shrink:0;">
      <span>✨</span> Yeni Sporcu
    </button>
  </div>

  <!-- Quick Filter Chips -->
  <div class="filter-chips" style="margin-bottom:16px;">
    <button class="filter-chip active" data-student-filter="all" onclick="filterStudentsList('all')">Tüm Sporcular</button>
    <button class="filter-chip" data-student-filter="renewal" onclick="filterStudentsList('renewal')">🔄 Yenileme Bekleyenler (0-1 Ders)</button>
    <button class="filter-chip" data-student-filter="active" onclick="filterStudentsList('active')">⚡ Aktif Paketi Olanlar</button>
    <button class="filter-chip" data-student-filter="expiring" onclick="filterStudentsList('expiring')">⚠️ Son 1-2 Ders</button>
    <button class="filter-chip" data-student-filter="frozen" onclick="filterStudentsList('frozen')">❄️ Dondurulanlar</button>
    <button class="filter-chip" data-student-filter="medical" onclick="filterStudentsList('medical')">🩺 Sakatlık / Kısıt</button>
  </div>

  <!-- Mobile-First Student Cards Feed (Reels-inspired) -->
  <div class="student-cards-grid" id="student-cards-grid">
    <div style="color:var(--text-muted); padding:32px; text-align:center;">Öğrenci listesi yükleniyor...</div>
  </div>

  <!-- Desktop Traditional Table View (Visible only on desktop screens) -->
  <div class="glass-card table-responsive desktop-only-table" style="margin-top:20px;">
    <table class="custom-table">
      <thead>
        <tr>
          <th>Ad Soyad & Sakatlık</th>
          <th>Telefon</th>
          <th>Aktif Paket Durumu</th>
          <th>Dönem</th>
          <th>İşlemler</th>
        </tr>
      </thead>
      <tbody id="members-table-body">
        <!-- Dynamically populated -->
      </tbody>
    </table>
  </div>
</section>
